spring:
  application:
    name: Auth-Service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: db/changelog/db.changelog-master.xml

server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /api/v1/

kafka:
  bootstrap-servers: kafka:9092

app:
  security:
    jwt:
      secret-key: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855   #рандомно сгенерированный ключ для токена
      expiration: 900000 #15 минут

